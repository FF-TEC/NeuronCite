# Dependabot configuration for automated dependency update pull requests.
# Covers three ecosystems: Rust crates (Cargo), Node.js packages (npm),
# Docker base images, and GitHub Actions versions.
#
# Schedule: weekly on Monday mornings (UTC) to batch updates into a single
# review session rather than creating PRs throughout the week.
#
# Each ecosystem is configured with a conservative open-pull-requests-limit
# to avoid overwhelming the review queue.

version: 2

updates:
  # Rust workspace dependencies (Cargo.toml / Cargo.lock).
  # Monitors all crates declared in [workspace.dependencies] and each
  # crate's own Cargo.toml for outdated or vulnerable versions.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(cargo):"
    ignore:
      # gtk and cairo-rs are pinned to 0.18 because tao 0.37 and wry 0.57
      # (native window and WebView used for the splash screen) still depend
      # on gtk 0.18, which requires cairo-rs 0.18. Bumping them without a
      # tao/wry release on the newer gtk-rs line causes compilation errors.
      - dependency-name: "cairo-rs"
        versions: [">= 0.19"]
      - dependency-name: "gtk"
        versions: [">= 0.19"]
      # windows crate must match the version tao and wry depend on (0.62 for
      # tao 0.37 / wry 0.57). Bumping it alone would pull in a second copy of
      # the windows crate and its proc-macros; bump it together with tao/wry.
      - dependency-name: "windows"
        versions: [">= 0.63"]

  # Node.js frontend dependencies (crates/neuroncite-web/frontend/).
  # Tracks SolidJS, Vite, TypeScript, and all transitive npm packages.
  - package-ecosystem: "npm"
    directory: "/crates/neuroncite-web/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(npm):"
    ignore:
      # eslint is pinned to v9 because eslint-plugin-jsx-a11y (latest 6.10.2,
      # peer dep) only supports eslint ^3 through ^9. The config already uses
      # the flat format (eslint.config.js), so v10 only needs a compatible
      # jsx-a11y release.
      - dependency-name: "eslint"
        versions: [">= 10"]
      # typescript is pinned to v6 because @typescript-eslint (parser and
      # eslint-plugin, latest 8.x) declares a peer range of
      # typescript ">=4.8.4 <6.1.0". TypeScript 7 makes `npm ci` fail with
      # ERESOLVE. Lift this once typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">= 7"]

  # Docker base images (docker/Dockerfile).
  # Monitors nvidia/cuda, rocm/dev-ubuntu, ubuntu, node, and rust base
  # images for security patches and version updates.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker):"

  # GitHub Actions workflow dependencies (.github/workflows/).
  # Tracks action versions (actions/checkout, dtolnay/rust-toolchain, etc.)
  # for security patches and feature updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions):"
